[project]
name = "automation-engine"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikita Selivanov",email = "flgjkdoged228@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all] (>=0.141.1,<0.142.0)",
    "faststream[cli,nats] (>=0.7.3,<0.8.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)"
]

[tool.poetry]
packages = [{include = "automation_engine", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
